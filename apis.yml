name: Nubis
description: 'Nubis Communications is a co-packaged optics (CPO) and silicon-photonics
  semiconductor startup building high-density, low-power optical interconnects for
  AI, machine-learning, and hyperscale data-center systems. Its technology places
  optics directly next to switch and accelerator ASICs to move data at very high bandwidth
  with dramatically lower energy per bit than pluggable optics. The company (originally
  at nubis-inc.com) has been absorbed into Ciena, whose optics-for-co-packaged-applications
  product line now carries the work; the former Nubis domain redirects to Ciena. As
  a fabless hardware / photonics-IP company it exposes no public developer API, SDK,
  OpenAPI specification, or developer portal, so no API artifacts apply to this record.'
